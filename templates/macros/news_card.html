{% macro news_card(post, language, category_classes, title_hover_class) -%}
<article class="news-card group flex h-full flex-col rounded-2xl p-6">
  <div class="mb-3 flex items-start justify-between gap-4">
    <span class="rounded-full px-3 py-1 text-xs font-medium {{ category_classes }}">
      {{ post.category }}
    </span>
    <time class="whitespace-nowrap text-xs font-light text-gray-500" datetime="{{ post.date.isoformat() }}">
      {{ post.date_text }}
    </time>
  </div>

  <h2 class="mb-2 text-lg font-semibold leading-snug">
    <a class="text-white transition-colors {{ title_hover_class }}" href="{{ post.url }}">{{ post.title }}</a>
  </h2>

  <p class="line-clamp-4 flex-1 text-sm font-light leading-relaxed text-gray-400">
    {{ post.summary }}
  </p>

  <footer class="mt-5 flex items-center justify-between gap-4 border-t border-gray-700/20 pt-4 text-xs font-light text-gray-500">
    <a class="truncate transition-colors hover:text-gray-300" href="{{ post.original_link }}" rel="noopener noreferrer nofollow" target="_blank">
      🔗 Product Hunt
    </a>
    <a class="shrink-0 transition-transform group-hover:translate-x-1" href="{{ post.url }}" aria-label="{{ post.title }} — {{ '查看详情' if language == 'zh' else 'Read more' }}">
      {{ '查看详情 →' if language == 'zh' else 'Read more →' }}
    </a>
  </footer>
</article>
{%- endmacro %}
